name: Build Electron App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            command: npm run dist:win -- --x64
            artifact_name: windows-x64-build
          - os: macos-latest
            platform: mac
            arch: x64
            command: npm run dist:mac -- --x64
            artifact_name: macos-x64-build
          - os: macos-latest
            platform: mac
            arch: arm64
            command: npm run dist:mac -- --arm64
            artifact_name: macos-arm64-build

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline tests
        run: npm test

      - name: Build app
        run: ${{ matrix.command }}

      - name: Verify packaged source and artifacts
        run: node scripts/verify-package.cjs dist ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/package-verification.json
          if-no-files-found: error
