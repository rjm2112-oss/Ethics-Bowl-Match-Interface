name: Build Electron App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            command: npm run dist:win -- --x64
            artifact_name: Windows-Installer
          - os: macos-latest
            platform: mac
            arch: x64
            command: npm run dist:mac -- --x64
            artifact_name: Mac-Intel
          - os: macos-latest
            platform: mac
            arch: arm64
            command: npm run dist:mac -- --arm64
            artifact_name: Mac-Apple-Silicon

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline tests
        run: npm test

      - name: Build app
        run: ${{ matrix.command }}

      - name: Verify packaged source and artifacts
        run: node scripts/verify-package.cjs dist ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Stage the verified installer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const report = JSON.parse(fs.readFileSync('dist/package-verification.json', 'utf8'));
          if (!report.verified) throw new Error('Package verification is required.');
          const installers = report.artifacts.filter(file => report.platform === 'win'
            ? file.name.endsWith('-setup.exe') : file.name.endsWith('.dmg'));
          if (installers.length !== 1) throw new Error('Exactly one installer is required.');
          const chip = { x64: 'Intel', arm64: 'Apple Silicon' }[report.arch];
          if (report.platform === 'mac' && !chip) throw new Error('Unknown Mac architecture.');
          const name = report.platform === 'mac'
            ? `${pkg.build.productName} ${pkg.version} - Mac ${chip}.dmg` : installers[0].name;
          fs.mkdirSync('dist/installers');
          fs.copyFileSync(`dist/${installers[0].name}`, `dist/installers/${name}`);
          NODE

      - name: Upload the verified installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/installers/*
          if-no-files-found: error
