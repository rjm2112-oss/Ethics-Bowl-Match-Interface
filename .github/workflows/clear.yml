name: Inspect build artifacts

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Report artifacts without deleting them
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            await core.summary.addHeading('Build artifacts').addTable([
              ['Name', 'Bytes', 'Created', 'Expired'],
              ...artifacts.map(a => [a.name, String(a.size_in_bytes), a.created_at, String(a.expired)])
            ]).addRaw('Local verified replacements are retained per platform/architecture. This workflow performs no deletion.').write();
